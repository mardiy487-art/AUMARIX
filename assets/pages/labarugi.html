<!-- ==========================================

     FILE : labarugi.html
========================================== -->

<div class="lr-container">

    <!-- HEADER -->
    <div class="lr-header">

        <div>
            <h2 class="lr-title">
                📊 Laporan Laba Rugi
            </h2>

            <p class="lr-subtitle">
                AUMARIX Accounting System
            </p>

            <div
                id="periodeLabaRugi"
                class="lr-period">
                Periode : Semua Data
            </div>
        </div>

    </div>

    <!-- FILTER PERIODE -->
    <div class="lr-filter">

        <div class="form-group">
            <label for="tanggalAwalLabaRugi">
                Dari Tanggal
            </label>

            <input
                type="date"
                id="tanggalAwalLabaRugi"
                class="form-control">
        </div>

        <div class="form-group">
            <label for="tanggalAkhirLabaRugi">
                Sampai Tanggal
            </label>

            <input
                type="date"
                id="tanggalAkhirLabaRugi"
                class="form-control">
        </div>

        <button
            type="button"
            class="btn btn-primary"
            onclick="loadLabaRugi()">
            🔍 Tampilkan
        </button>

        <button
            type="button"
            class="btn btn-success"
            onclick="loadLabaRugi()">
            🔄 Refresh
        </button>

        <button
            type="button"
            class="btn btn-secondary"
            onclick="resetLabaRugi()">
            ♻️ Reset
        </button>

        <button
            type="button"
            class="btn btn-warning"
            onclick="exportLabaRugiExcel()">
            📊 Excel
        </button>

        <button
            type="button"
            class="btn btn-danger"
            onclick="exportLabaRugiPDF()">
            📄 PDF
        </button>

    </div>

    <!-- SUMMARY UTAMA -->
    <div class="lr-summary">

        <div class="summary-card penjualan">
            <div class="summary-label">
                Penjualan Bersih
            </div>

            <div
                id="summaryPenjualan"
                class="summary-value">
                Rp 0
            </div>
        </div>

        <div class="summary-card kotor">
            <div class="summary-label">
                Laba Kotor
            </div>

            <div
                id="summaryLabaKotor"
                class="summary-value">
                Rp 0
            </div>
        </div>

        <div class="summary-card beban">
            <div class="summary-label">
                Total Beban
            </div>

            <div
                id="summaryBeban"
                class="summary-value">
                Rp 0
            </div>
        </div>

        <div class="summary-card bersih">
            <div class="summary-label">
                Laba Bersih
            </div>

            <div
                id="summaryLabaBersih"
                class="summary-value">
                Rp 0
            </div>
        </div>

    </div>

    <!-- SUMMARY TAMBAHAN -->
    <div class="lr-summary">

        <div class="summary-card">
            <div class="summary-label">
                Status Perusahaan
            </div>

            <div
                id="statusLabaRugi"
                class="summary-value">
                -
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-label">
                Margin Kotor
            </div>

            <div
                id="marginKotor"
                class="summary-value">
                0 %
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-label">
                Margin Bersih
            </div>

            <div
                id="marginBersih"
                class="summary-value">
                0 %
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-label">
                Jumlah Akun Laba Rugi
            </div>

            <div
                id="jumlahAkunLabaRugi"
                class="summary-value">
                0
            </div>
        </div>

    </div>

    <!-- INFO CETAK -->
    <div class="lr-summary">

        <div class="summary-card">
            <div class="summary-label">
                Tanggal Cetak
            </div>

            <div
                id="tanggalCetak"
                class="summary-value">
                -
            </div>
        </div>

    </div>

    <!-- DETAIL LAPORAN -->
    <div
        id="labarugiContent"
        class="lr-content">

        <div class="loading-box">
            Memuat laporan laba rugi...
        </div>

    </div>

</div>
