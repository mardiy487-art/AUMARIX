<div class="card coa-page">

    <div class="page-header">
        <div>
            <h3>📒 Chart Of Accounts</h3>
            <p class="page-subtitle">
                Kelola daftar akun untuk sistem akuntansi AUMARIX
            </p>
        </div>

        <div class="header-actions">
            <button type="button" class="btn btn-primary" onclick="showCOAModal()">
                ➕ Tambah Akun
            </button>

            <button type="button" class="btn btn-warning" onclick="exportCOAExcel()">
                📤 Excel
            </button>

            <button type="button" class="btn btn-danger" onclick="exportCOAPDF()">
                📄 PDF
            </button>
        </div>
    </div>

    <div class="coa-summary">
        <div class="summary-card">
            <div class="summary-title">Total Akun</div>
            <div id="totalAkun" class="summary-value">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">Total Debit Awal</div>
            <div id="totalDebitAwal" class="summary-value">Rp 0</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">Total Kredit Awal</div>
            <div id="totalKreditAwal" class="summary-value">Rp 0</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">Status</div>
            <div id="statusBalance" class="summary-value">-</div>
        </div>
    </div>

    <div class="search-filter">
        <input
            type="text"
            id="searchCOA"
            class="form-control"
            placeholder="🔍 Cari kode akun atau nama akun..."
            onkeyup="filterCOA()">

        <select
            id="filterKelompok"
            class="form-control"
            onchange="filterCOA()">
            <option value="">Semua Kelompok</option>
        </select>
    </div>

    <div class="table-responsive">
        <table class="table coa-table">
            <thead>
                <tr>
                    <th>Kode Akun</th>
                    <th>Nama Akun</th>
                    <th>Kelompok Akun</th>
                    <th>Pos Saldo</th>
                    <th>Pos Laporan</th>
                    <th class="text-right">Saldo Awal Debit</th>
                    <th class="text-right">Saldo Awal Kredit</th>
                    <th>Jenis Akun</th>
                    <th width="170">Aksi</th>
                </tr>
            </thead>

            <tbody id="coaTable">
                <tr>
                    <td colspan="9" class="empty-table">
                        Memuat data COA...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<div class="modal" id="coaModal">
    <div class="modal-content">

        <div class="modal-header">
            <h3 id="modalTitle">Tambah COA</h3>

            <button type="button" class="modal-close" onclick="closeCOAModal()">
                ×
            </button>
        </div>

        <input type="hidden" id="editMode">
        <input type="hidden" id="oldKodeAkun">

        <div class="form-grid">

            <div class="form-group">
                <label class="form-label" for="coaKode">Kode Akun</label>
                <input id="coaKode" class="form-control" placeholder="Contoh: 11110">
            </div>

            <div class="form-group">
                <label class="form-label" for="coaNama">Nama Akun</label>
                <input id="coaNama" class="form-control" placeholder="Contoh: Kas Ditangan">
            </div>

            <div class="form-group">
                <label class="form-label" for="coaKelompok">Kelompok Akun</label>
                <select id="coaKelompok" class="form-control">
                    <option value="">-- Pilih Kelompok Akun --</option>
                    <option value="Aset Lancar">Aset Lancar</option>
                    <option value="Aset Tetap">Aset Tetap</option>
                    <option value="Akumulasi Penyusutan">Akumulasi Penyusutan</option>
                    <option value="Kewajiban Lancar">Kewajiban Lancar</option>
                    <option value="Kewajiban Jangka Panjang">Kewajiban Jangka Panjang</option>
                    <option value="Ekuitas">Ekuitas</option>
                    <option value="Prive">Prive</option>
                    <option value="Pendapatan">Pendapatan</option>
                    <option value="Potongan Penjualan">Potongan Penjualan</option>
                    <option value="Retur Penjualan">Retur Penjualan</option>
                    <option value="Harga Pokok Penjualan">Harga Pokok Penjualan</option>
                    <option value="Potongan Pembelian">Potongan Pembelian</option>
                    <option value="Beban Operasional">Beban Operasional</option>
                    <option value="Beban Penyusutan">Beban Penyusutan</option>
                    <option value="Beban Pajak">Beban Pajak</option>
                    <option value="Pendapatan Lain-lain">Pendapatan Lain-lain</option>
                    <option value="Beban Lain-lain">Beban Lain-lain</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="coaPosSaldo">Pos Saldo</label>
                <select id="coaPosSaldo" class="form-control">
                    <option value="">-- Pilih Pos Saldo --</option>
                    <option value="Debit">Debit</option>
                    <option value="Kredit">Kredit</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="coaPosLaporan">Pos Laporan</label>
                <select id="coaPosLaporan" class="form-control">
                    <option value="">-- Pilih Pos Laporan --</option>
                    <option value="Neraca">Neraca</option>
                    <option value="Laba Rugi">Laba Rugi</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="coaDebit">Saldo Awal Debit</label>
                <input type="number" id="coaDebit" class="form-control" value="0" min="0">
            </div>

            <div class="form-group">
                <label class="form-label" for="coaKredit">Saldo Awal Kredit</label>
                <input type="number" id="coaKredit" class="form-control" value="0" min="0">
            </div>

            <div class="form-group">
                <label class="form-label" for="coaJenisAkun">Jenis Akun</label>
                <select id="coaJenisAkun" class="form-control">
                    <option value="NON KAS">NON KAS</option>
                    <option value="KAS">KAS</option>
                </select>
            </div>

        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-success" onclick="saveCOAData()">
                💾 Simpan
            </button>

            <button type="button" class="btn btn-danger" onclick="closeCOAModal()">
                ❌ Batal
            </button>
        </div>

    </div>
</div>
