========================================== -->

<div class="pm-container">

    <!-- HEADER -->
    <div class="pm-header">

        <div>
            <h2 class="pm-title">
                💼 Laporan Perubahan Modal
            </h2>

            <p class="pm-subtitle">
                AUMARIX Accounting System
            </p>
        </div>

        <div
            id="periodePerubahanModal"
            class="pm-period">
            Periode : Semua Data
        </div>

    </div>

    <!-- FILTER -->
    <div class="pm-filter">

        <div class="form-group">
            <label for="tanggalAwalPM">
                Dari Tanggal
            </label>

            <input
                type="date"
                id="tanggalAwalPM"
                class="form-control">
        </div>

        <div class="form-group">
            <label for="tanggalAkhirPM">
                Sampai Tanggal
            </label>

            <input
                type="date"
                id="tanggalAkhirPM"
                class="form-control">
        </div>

        <button
            type="button"
            class="btn btn-primary"
            onclick="loadPerubahanModal()">
            🔍 Tampilkan
        </button>

        <button
            type="button"
            class="btn btn-success"
            onclick="loadPerubahanModal()">
            🔄 Refresh
        </button>

        <button
            type="button"
            class="btn btn-secondary"
            onclick="resetPerubahanModal()">
            ♻️ Reset
        </button>

        <button
            type="button"
            class="btn btn-warning"
            onclick="exportPerubahanModalExcel()">
            📊 Excel
        </button>

        <button
            type="button"
            class="btn btn-danger"
            onclick="exportPerubahanModalPDF()">
            📄 PDF
        </button>

    </div>

    <!-- SUMMARY UTAMA -->
    <div class="pm-summary">

        <div class="pm-summary-card modal-awal">
            <div class="pm-summary-label">
                Modal Awal
            </div>

            <div
                id="pmModalAwal"
                class="pm-summary-value">
                Rp 0
            </div>
        </div>

        <div class="pm-summary-card investasi">
            <div class="pm-summary-label">
                Investasi Pemilik
            </div>

            <div
                id="pmInvestasi"
                class="pm-summary-value">
                Rp 0
            </div>
        </div>

        <div class="pm-summary-card laba">
            <div class="pm-summary-label">
                Laba Bersih
            </div>

            <div
                id="pmLabaBersih"
                class="pm-summary-value">
                Rp 0
            </div>
        </div>

        <div class="pm-summary-card prive">
            <div class="pm-summary-label">
                Prive
            </div>

            <div
                id="pmPrive"
                class="pm-summary-value">
                Rp 0
            </div>
        </div>

        <div class="pm-summary-card modal-akhir">
            <div class="pm-summary-label">
                Modal Akhir
            </div>

            <div
                id="pmModalAkhir"
                class="pm-summary-value">
                Rp 0
            </div>
        </div>

    </div>

    <!-- INFO CARD -->
    <div class="pm-summary">

        <div class="pm-summary-card info-card">
            <div class="pm-summary-label">
                Status Modal
            </div>

            <div
                id="statusModal"
                class="pm-summary-value">
                -
            </div>
        </div>

        <div class="pm-summary-card info-card">
            <div class="pm-summary-label">
                Pertumbuhan Modal
            </div>

            <div
                id="growthModal"
                class="pm-summary-value">
                0 %
            </div>
        </div>

        <div class="pm-summary-card info-card">
            <div class="pm-summary-label">
                Jumlah Akun Ekuitas
            </div>

            <div
                id="jumlahAkunEkuitas"
                class="pm-summary-value">
                0
            </div>
        </div>

        <div class="pm-summary-card info-card">
            <div class="pm-summary-label">
                Tanggal Cetak
            </div>

            <div
                id="tanggalCetakPM"
                class="pm-summary-value">
                -
            </div>
        </div>

    </div>

    <!-- DETAIL LAPORAN -->
    <div
        id="perubahanModalContent"
        class="pm-content">

        <div class="loading-box">
            Memuat Laporan Perubahan Modal...
        </div>

    </div>

</div>
